<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111a2e"><title>문의 접수 완료 | 다이룬</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet"><style>:root{--ink:#111a2e;--blue:#2555d9;--paper:#f4f6fa;--line:#dce1ea}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 50% 0,#e8efff 0,transparent 42%),var(--paper);font-family:"Nanum Gothic",sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(620px,100%);background:#fff;border:1px solid var(--line);box-shadow:0 22px 70px rgba(17,26,46,.12);padding:64px 58px 40px;text-align:center}.check{width:64px;height:64px;margin:0 auto 28px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:800}.eyebrow{margin:0 0 14px;color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.2em}.title{margin:0;font-size:clamp(30px,6vw,46px);line-height:1.3;letter-spacing:-.055em}.message{margin:24px auto 0;max-width:450px;color:#4d586c;font-size:17px;line-height:1.9;word-break:keep-all}.home{display:inline-flex;align-items:center;justify-content:center;gap:22px;margin-top:34px;min-height:50px;padding:12px 24px;background:var(--blue);color:#fff;text-decoration:none;font-size:14px;font-weight:800}.brand{border-top:1px solid var(--line);margin-top:52px;padding-top:28px}.logo{width:170px;height:auto;margin:0 auto;display:block}@media(max-width:600px){body{padding:16px}.card{padding:48px 24px 30px}.message{font-size:15px}.brand{margin-top:40px}}@media(prefers-reduced-motion:no-preference){.card{animation:enter .65s cubic-bezier(.25,1,.5,1) both}.check{animation:pop .55s .25s cubic-bezier(.25,1.4,.5,1) both}@keyframes enter{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.65)}to{opacity:1;transform:scale(1)}}}</style></head><body><main class="card"><div class="check" aria-hidden="true">✓</div><p class="eyebrow">INQUIRY RECEIVED</p><h1 class="title">문의가 접수되었습니다.</h1><p class="message">문의하신 내용을 확인한 후, <br>신속히 검토하여 회신해 드리겠습니다.</p><a class="home" href="/">홈으로 돌아가기 <span aria-hidden="true">→</span></a><div class="brand"><svg class="logo" viewBox="655 595 1506 336" role="img" aria-label="다이룬 dairoon"><image href="/logo-source.webp" width="2816" height="1536"></image></svg></div></main></body></html>
